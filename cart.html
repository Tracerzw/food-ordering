<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Bulawayo Bites</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🍽️ Bulawayo Bites</h1>
    <nav>
      <a href="index.html">Menu</a>
      <a href="orders.html">My Orders</a>
      <a href="cart.html" class="active">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main class="container">
    <h2>Your Cart</h2>

    <div id="cart-section">
      <div id="cart-items"></div>

      <div id="summary"></div>

      <form id="checkout-form" novalidate>
        <h3>Delivery Details</h3>

        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="e.g. Tendai Moyo">
        <small class="error" id="name-error"></small>

        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="e.g. 0771234567">
        <small class="error" id="phone-error"></small>

        <label for="address">Delivery address</label>
        <textarea id="address" rows="3" placeholder="Street, suburb, landmark"></textarea>
        <small class="error" id="address-error"></small>

        <label for="payment">Payment method</label>
        <select id="payment">
          <option value="Cash on delivery">Cash on delivery</option>
          <option value="EcoCash">EcoCash</option>
          <option value="Card">Card</option>
        </select>

        <button type="submit" class="primary-btn">Place Order</button>
      </form>
    </div>

    <div id="confirmation" hidden></div>
  </main>

  <div id="toast"></div>
  <footer><p>&copy; 2026 Bulawayo Bites</p></footer>

  <script src="js/cart.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
